<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Allowed Hosts</title>
  </head>
  <body>
    <h1>Testing allowedHosts Setting</h1>
    <div id="result"></div>

    <script>
      // Replace with the actual URL of your server
      const serverUrl = "http://localhost:3002/api/health";

      fetch(serverUrl)
        .then((response) => response.text())
        .then((data) => {
          document.getElementById(
            "result"
          ).textContent = `Success! Server responded: ${data}`;
        })
        .catch((error) => {
          document.getElementById(
            "result"
          ).textContent = `Error: ${error.message}`;
        });
    </script>
  </body>
</html>
